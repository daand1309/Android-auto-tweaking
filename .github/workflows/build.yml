name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      stable_key: ${{ steps.key.outputs.stable_key }}
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (only if secrets are set)
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Pasting on a phone often adds line breaks/spaces - strip all whitespace first.
            CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
            # The trailing '=' padding is easy to miss when selecting on a phone; restore it.
            # (Safe: the keytool check below fails if the result isn't really the keystore.)
            while [ $(( ${#CLEAN} % 4 )) -ne 0 ]; do CLEAN="${CLEAN}="; done
            echo "KEYSTORE_BASE64: ${#CLEAN} characters after cleaning (a complete one is 5676)"
            if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
              echo "::error::KEYSTORE_BASE64 secret is not valid base64 - it was probably cut off when copying. Paste the whole block again."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              # Tell which secret is wrong by comparing the decoded file with the known keystore fingerprint
              # (a fingerprint of the password-protected file - safe to publish).
              if [ "$(sha256sum "$RUNNER_TEMP/release.jks" | cut -d' ' -f1)" = "eb3ae8860bf69aac69e26e1bead11787eee7b5d77ba2d85bdd81fd4a5942bff9" ]; then
                echo "::error::KEYSTORE_BASE64 is correct, but KEYSTORE_PASSWORD is wrong - paste the password again."
              else
                echo "::error::KEYSTORE_BASE64 is damaged (a character is missing or changed) - paste it again."
              fi
              exit 1
            fi
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using stable signing key"
            echo "stable_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret - using debug key (uninstall old version before updating)"
          fi

      - name: Build APK and run lint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease lintRelease --no-daemon

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Name APK and write checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DriveMusic.apk
          (cd dist && sha256sum DriveMusic.apk > DriveMusic.apk.sha256 && cat DriveMusic.apk.sha256)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveMusic-apk
          path: dist/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (Robolectric)
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/

  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: End-to-end tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  # Publishes a GitHub Release that the in-app updater picks up. Only when everything passed,
  # the APK is signed with the permanent key, and this is a push to the default branch.
  release:
    needs: [build, unit-tests, emulator-tests]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch &&
      needs.build.outputs.stable_key == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DriveMusic-apk
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
          TAG: v1.${{ github.run_number }}
        run: |
          (cd dist && sha256sum -c DriveMusic.apk.sha256)
          gh release create "$TAG" dist/DriveMusic.apk dist/DriveMusic.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Drive Music ${TAG#v}" --notes "$NOTES"
